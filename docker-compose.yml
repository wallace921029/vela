services:
  backend:
    build:
      context: ./backend
    image: vela-backend:latest
    container_name: vela-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/db
    networks:
      - vela

  frontend:
    build:
      context: .
    image: vela-frontend:latest
    container_name: vela-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - vela

networks:
  vela:
    driver: bridge
